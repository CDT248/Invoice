
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RS NETWORK Settings</title>
<style>
body{margin:0;background:#0b1220;color:#edf3ff;font:16px Arial;padding:20px}
main{max-width:720px;margin:30px auto}
.card{background:#152238;padding:22px;border-radius:14px;margin:15px 0}
input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px;background:#091426;color:white;border:1px solid #34445f;border-radius:8px}
button{padding:12px 17px;background:#12b886;color:#06251c;border:0;border-radius:8px;cursor:pointer;margin:5px}
a{color:#40d9b0}
small{color:#a9b8cd}
</style>
</head>
<body>
<main>
<h1>RS NETWORK</h1>
<p>Central API Settings</p>
<div class="card">
<label>Customer Apps Script Web App URL</label>
<input id="customerUrl" placeholder="https://script.google.com/macros/s/.../exec">
<label>Gmail Apps Script Web App URL</label>
<input id="gmailUrl" placeholder="https://script.google.com/macros/s/.../exec">
<button onclick="save()">Save URLs</button>
<button onclick="test()">Test Connections</button>
<p id="msg"></p>
</div>
<div class="card">
<h3>Open Dashboard</h3>
<p><a href="customar.html">Customer Management</a></p>
<p><a href="gmail.html">Gmail & Billing Dashboard</a></p>
<small>Save both URLs before opening the dashboards. Use the same API key in both Apps Script projects and the HTML files.</small>
</div>
</main>
<script>
const KEY='RS_NETWORK_2026_CHANGE_THIS_KEY';
const $=id=>document.getElementById(id);
$('customerUrl').value=localStorage.getItem('rs_customer_api')||'';
$('gmailUrl').value=localStorage.getItem('rs_gmail_api')||'';

function save(){
 const c=$('customerUrl').value.trim(),g=$('gmailUrl').value.trim();
 if(!c||!g){$('msg').textContent='Enter both URLs.';return;}
 localStorage.setItem('rs_customer_api',c);
 localStorage.setItem('rs_gmail_api',g);
 $('msg').textContent='URLs saved in this browser.';
}

function jsonp(url,action){
 return new Promise((resolve,reject)=>{
  const cb='rs_'+Date.now()+'_'+Math.floor(Math.random()*99999);
  const s=document.createElement('script');
  const q=new URLSearchParams({action,key:KEY,callback:cb});
  const timer=setTimeout(()=>{clean();reject(Error('Connection timeout'));},15000);
  function clean(){clearTimeout(timer);delete window[cb];s.remove();}
  window[cb]=r=>{clean();r.success?resolve(r.data):reject(Error(r.error||'API error'));};
  s.onerror=()=>{clean();reject(Error('Cannot connect'));};
  s.src=url+'?'+q;s.onerror=()=>{clean();reject(Error('Cannot connect'));};
  document.body.appendChild(s);
 });
}

async function test(){
 save();
 $('msg').textContent='Testing...';
 try{
  const c=await jsonp($('customerUrl').value.trim(),'ping');
  const g=await jsonp($('gmailUrl').value.trim(),'ping');
  $('msg').textContent='Customer: connected. Gmail: connected.';
 }catch(e){$('msg').textContent='Error: '+e.message;}
}
</script>
</body>
</html>
