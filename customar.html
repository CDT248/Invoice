
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RS NETWORK Customers</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf3ff;font:15px Arial}
header{padding:18px;background:#101b2d;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
main{max-width:1250px;margin:auto;padding:18px}.card{background:#152238;padding:17px;border-radius:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
input,select{width:100%;padding:10px;background:#091426;color:white;border:1px solid #34445f;border-radius:7px;margin:5px 0 12px}
button{padding:10px 13px;border:0;border-radius:7px;cursor:pointer;background:#12b886;color:#05261d;margin:3px}
.del{background:#fa5252;color:white}.muted{color:#a9b8cd}.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:850px}td,th{text-align:left;padding:10px;border-bottom:1px solid #30405a;font-size:13px}
th{color:#38d9a9}h2{margin-top:0}
</style>
</head>
<body>
<header><strong>RS NETWORK — Customers</strong><a href="index.html" style="color:#38d9a9">API Settings</a></header>
<main>
<div class="card">
<h2 id="formTitle">Add Customer</h2>
<input id="row" type="hidden">
<div class="grid" id="fields"></div>
<button onclick="saveCustomer()">Save Customer</button>
<button onclick="resetForm()" style="background:#34445f;color:white">Clear Form</button>
<button onclick="load()" style="background:#34445f;color:white">Refresh</button>
<p id="msg" class="muted"></p>
</div>
<div class="card">
<h2>Customer List</h2>
<input id="search" placeholder="Search name, phone, IP, email..." oninput="render()">
<div class="tablewrap"><table><thead><tr>
<th>SI</th><th>Name</th><th>Phone</th><th>IP</th><th>Bill</th><th>Billing Date</th><th>Email</th><th>Actions</th>
</tr></thead><tbody id="list"></tbody></table></div>
</div>
</main>
<script>
const KEY='RS_NETWORK_2026_CHANGE_THIS_KEY';
const fields=[
['si','SI'],['ip','IP'],['name','Name'],['phone','Phone'],
['reason','Reason'],['billTrigger','Bill Triger'],['bill','Customer Bill'],
['billingDate','Billing Date'],['ipBillTrigger','IP Bill Triger'],
['ipBill','IP Bill'],['area','Area'],['address','Address'],
['location','Location'],['onu','ONU'],['fiber','Faibar'],
['email',"Gmail's"],['collect','Collect'],['renew','Renew']
];
const $=id=>document.getElementById(id);
let customers=[];
$('fields').innerHTML=fields.map(([k,label])=>`<label>${label}<input id="f_${k}"></label>`).join('');

function api(action,extra={}){
 const url=localStorage.getItem('rs_customer_api');
 if(!url) return Promise.reject(Error('Open index.html and save the Customer API URL first.'));
 return new Promise((resolve,reject)=>{
  const cb='cc_'+Date.now()+'_'+Math.floor(Math.random()*9999);
  const s=document.createElement('script'),q=new URLSearchParams({key:KEY,action,callback:cb,...extra});
  const timer=setTimeout(()=>{clean();reject(Error('Request timeout'));},20000);
  function clean(){clearTimeout(timer);delete window[cb];s.remove();}
  window[cb]=r=>{clean();r.success?resolve(r.data):reject(Error(r.error||'API error'));};
  s.onerror=()=>{clean();reject(Error('API connection failed'));};
  s.src=url+'?'+q.toString();document.body.appendChild(s);
 });
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function message(t){$('msg').textContent=t;}
async function load(){try{customers=await api('getcustomers');render();message('Loaded '+customers.length+' customers.');}catch(e){message(e.message);}}
function render(){
 const q=$('search').value.toLowerCase();
 const list=customers.filter(c=>[c.name,c.phone,c.ip,c.email].join(' ').toLowerCase().includes(q));
 $('list').innerHTML=list.map(c=>`<tr><td>${esc(c.si)}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.ip)}</td><td>${esc(c.bill)}</td><td>${esc(c.billingDate)}</td><td>${esc(c.email)}</td><td><button onclick="edit(${c.row})">Edit</button><button class="del" onclick="removeCustomer(${c.row})">Delete</button></td></tr>`).join('');
}
function edit(row){
 const c=customers.find(x=>x.row===row);if(!c)return;
 $('row').value=row;$('formTitle').textContent='Edit Customer';
 fields.forEach(([k])=>$('f_'+k).value=c[k]||'');
 window.scrollTo({top:0,behavior:'smooth'});
}
function resetForm(){
 $('row').value='';$('formTitle').textContent='Add Customer';
 fields.forEach(([k])=>$('f_'+k).value='');message('');
}
async function saveCustomer(){
 const customer={row:$('row').value};
 fields.forEach(([k])=>customer[k]=$('f_'+k).value.trim());
 if(!customer.name&&!customer.phone){message('Enter at least a customer name or phone number.');return;}
 try{
  const result=await api('savecustomer',{customer:JSON.stringify(customer)});
  message(result.message||'Saved.');
  resetForm();await load();
 }catch(e){message('Save failed: '+e.message);}
}
async function removeCustomer(row){
 if(!confirm('Delete this customer row from the Sheet?'))return;
 try{const r=await api('deletecustomer',{row});message(r.message);await load();}
 catch(e){message('Delete failed: '+e.message);}
}
load();
</script>
</body>
</html>
