const customerFrame=document.getElementById('customerFrame');
const gmailFrame=document.getElementById('gmailFrame');
customerFrame.srcdoc=CUSTOMER_HTML;
gmailFrame.srcdoc=GMAIL_HTML;
let activeSystem='customer';
function switchSystem(button){
 const system=button.dataset.system;
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b===button));
 activeSystem=system;
 customerFrame.classList.toggle('active',system==='customer');
 gmailFrame.classList.toggle('active',system==='gmail');
 document.getElementById('currentTitle').textContent=button.dataset.title||'ONE ONLINE';
 if(system==='gmail' && button.dataset.page){
   const win=gmailFrame.contentWindow;
   if(win && typeof win.showPage==='function') win.showPage(button.dataset.page);
 }
 document.getElementById('masterSidebar').classList.remove('open');
}
document.querySelectorAll('.nav-btn').forEach(button=>button.addEventListener('click',()=>switchSystem(button)));
document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('masterSidebar').classList.toggle('open'));
gmailFrame.addEventListener('load',()=>{
 if(activeSystem==='gmail'){const b=document.querySelector('.nav-btn[data-system="gmail"][data-page="dashboard"]');if(b)gmailFrame.contentWindow.showPage('dashboard')}
});
</script></body></html>
