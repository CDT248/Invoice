<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<title>ONE ONLINE | Master Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{color-scheme:light;--navy:#102a43;--bg:#f3f6f8;--surface:#fff;--text:#172033;--muted:#8292a4;--line:#e5ebf0;--shadow:0 5px 22px #102a4310}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.master-sidebar{position:fixed;inset:0 auto 0 0;width:258px;background:linear-gradient(180deg,#102a43,#0c2236);color:#fff;padding:22px 15px;display:flex;flex-direction:column;z-index:100;overflow-y:auto;transition:transform .25s}
.master-brand{display:flex;align-items:center;gap:12px;padding:4px 9px 23px;border-bottom:1px solid #ffffff20;margin-bottom:16px}
.master-brand-icon{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#12b886,#087f5b);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px #087f5b55}
.master-brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px}.master-brand p{font-size:9px;color:#a9c0d1;margin:5px 0 0;letter-spacing:1.5px}
.nav-label{font-size:9px;color:#91a9bc;font-weight:800;letter-spacing:1.5px;padding:0 11px;margin:13px 0 8px}
.master-nav{width:100%;border:0;background:transparent;color:#c3d2df;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;text-align:left;font-size:12px;font-weight:650;margin:2px 0;cursor:pointer;transition:.18s}
.master-nav i{width:19px;text-align:center;font-size:14px}.master-nav:hover{background:#ffffff12;color:#fff}.master-nav.active{background:#e7f7f0;color:#087f5b;font-weight:800}
.nav-divider{height:1px;background:#ffffff1c;margin:12px 7px 7px}
.sidebar-foot{margin-top:auto;border:1px solid #ffffff20;background:#ffffff0b;border-radius:11px;padding:12px;font-size:10px;color:#c4d5e2;line-height:1.7}
.sidebar-foot strong{color:#fff;display:block;font-size:11px;margin-bottom:3px}
.master-main{margin-left:258px;min-height:100vh;display:flex;flex-direction:column;min-width:0}
.master-topbar{height:68px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:20;flex-shrink:0}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}.master-topbar h2{font-size:15px;margin:0;font-weight:800}.master-topbar p{font-size:10px;color:var(--muted);margin:4px 0 0}
.top-actions{display:flex;align-items:center;gap:9px}
.system-pill{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;color:#087f5b;background:#eaf8f1;padding:8px 11px;border-radius:30px;white-space:nowrap}
.system-pill span{width:7px;height:7px;background:#12b886;border-radius:50%}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;display:grid;place-items:center;cursor:pointer;font-size:15px}
.icon-btn:hover{border-color:#12b886;color:#087f5b}
.menu-toggle{display:none}
.workspace{flex:1;min-height:0;padding:12px}
.app-frame{display:none;width:100%;height:calc(100vh - 92px);min-height:600px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.app-frame.active{display:block}
.sidebar-backdrop{display:none}
html[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--surface:#111c2d;--text:#e5edf7;--muted:#9fb0c5;--line:#26364b;--shadow:0 5px 22px #0004}
html[data-theme="dark"] body{background:var(--bg);color:var(--text)}
html[data-theme="dark"] .master-topbar{background:var(--surface);border-color:var(--line)}
html[data-theme="dark"] .icon-btn{background:#17263a;border-color:#34465d;color:#e5edf7}
html[data-theme="dark"] .system-pill{background:#123b32;color:#78e0b9}
html[data-theme="dark"] .app-frame{background:#0b1220;border-color:var(--line)}
@media(max-width:760px){
  .master-sidebar{transform:translateX(-105%);box-shadow:none;width:min(82vw,300px);padding:18px 13px}
  .master-sidebar.open{transform:translateX(0);box-shadow:10px 0 35px #0005}
  .sidebar-backdrop.show{display:block;position:fixed;inset:0;background:#06111dcc;z-index:90}
  .master-main{margin-left:0;width:100%;min-height:100dvh}
  .menu-toggle{display:grid}
  .master-topbar{height:62px;padding:0 11px;gap:8px}
  .master-topbar h2{font-size:13px}.master-topbar p{font-size:9px}
  .top-actions{gap:6px}.system-pill{font-size:9px;padding:7px 8px}
  .icon-btn{width:35px;height:35px}
  .workspace{padding:7px}
  .app-frame{height:calc(100dvh - 76px);min-height:520px;border-radius:8px}
}
@media(max-width:420px){
  .system-pill{display:none}
  .master-topbar{padding:0 9px}
  .workspace{padding:5px}
  .app-frame{height:calc(100dvh - 72px);min-height:500px}
}
</style>
</head>

function decodeUTF8Base64(value){
  const binary=atob(value);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
const customerFrame=document.getElementById('customerFrame');
const gmailFrame=document.getElementById('gmailFrame');
customerFrame.srcdoc=decodeUTF8Base64(CUSTOMER_SOURCE);
gmailFrame.srcdoc=decodeUTF8Base64(GMAIL_SOURCE);
let currentSystem='customer';
function getTheme(){return document.documentElement.getAttribute('data-theme')||'light'}
function sendTheme(frame){try{frame.contentWindow.postMessage({type:'ONE_ONLINE_MASTER_THEME',theme:getTheme()},'*')}catch(e){}}
function syncThemes(){sendTheme(customerFrame);sendTheme(gmailFrame)}
customerFrame.addEventListener('load',syncThemes);
gmailFrame.addEventListener('load',syncThemes);
function setActiveButton(button){
  document.querySelectorAll('.master-nav[data-system]').forEach(item=>item.classList.toggle('active',item===button));
}
function closeSidebar(){
  document.getElementById('masterSidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}
function navigate(button){
  const system=button.dataset.system;
  if(!system)return;
  currentSystem=system;
  setActiveButton(button);
  document.getElementById('currentTitle').textContent=button.dataset.title||button.innerText.trim();
  customerFrame.classList.toggle('active',system==='customer');
  gmailFrame.classList.toggle('active',system==='gmail');
  if(system==='gmail'&&button.dataset.page){
    gmailFrame.contentWindow.postMessage({type:'ONE_ONLINE_MASTER_NAVIGATE',page:button.dataset.page},'*');
  }
  closeSidebar();
}
document.querySelectorAll('.master-nav[data-system]').forEach(button=>button.addEventListener('click',()=>navigate(button)));
document.getElementById('masterRefresh').addEventListener('click',()=>{
  if(currentSystem==='customer'){
    try{customerFrame.contentWindow.loadData()}catch(e){customerFrame.contentWindow.location.reload()}
  }else{
    gmailFrame.contentWindow.postMessage({type:'ONE_ONLINE_MASTER_REFRESH'},'*');
  }
  closeSidebar();
});
document.getElementById('menuToggle').addEventListener('click',()=>{
  document.getElementById('masterSidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('show');
});
document.getElementById('sidebarBackdrop').addEventListener('click',closeSidebar);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar()});
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  const dark=theme==='dark';
  const button=document.getElementById('themeToggle');
  button.innerHTML=dark?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>';
  button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
  button.title=dark?'Switch to light mode':'Switch to dark mode';
  document.querySelector('meta[name="theme-color"]').content=dark?'#0b1220':'#102a43';
  try{localStorage.setItem('oneOnlineDashboardTheme',theme)}catch(e){}
  syncThemes();
}
document.getElementById('themeToggle').addEventListener('click',()=>applyTheme(getTheme()==='dark'?'light':'dark'));
let initialTheme='light';
try{initialTheme=localStorage.getItem('oneOnlineDashboardTheme')||'light'}catch(e){}
applyTheme(initialTheme);
// Customer Management is the startup screen. Gmail pages are opened from the shared master sidebar.
</script>
</body>
